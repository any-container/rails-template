name: "Fresh API Rails App (w/ Postgresql & RSpec)"
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  # Reference gist for rails new https://gist.github.com/eliotsykes/ace0222174804372b51a
  # TODO make a vanilla version of this that does plain `rails new`
  # TODO have them share GA code
  setup-rails:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      rails_version: ${{ steps.rails.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby
        uses: ruby/setup-ruby@v1.329.0
      - name: Install Rails
        run: |
          gem install rails
      # Each Rails release gets its own folder: rails-api/postgres-rspec/<version>
      - name: Get Rails version
        id: rails
        run: |
          echo "version=$(rails -v | awk '{print $2}')" >> $GITHUB_OUTPUT
      # gem install puts gems in gemdir but their executables (e.g. rails) in bindir
      - name: Get gem and bin directories
        id: gems
        run: |
          echo "gemdir=$(gem env gemdir)" >> $GITHUB_OUTPUT
          echo "bindir=$(ruby -e 'puts Gem.bindir')" >> $GITHUB_OUTPUT
      - name: Cache installed gems
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.gems.outputs.gemdir }}
            ${{ steps.gems.outputs.bindir }}
          key: rails-gems-${{ runner.os }}-${{ github.run_id }}

  create-app:
    needs: setup-rails
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      APP_DIR: rails-api/postgres-rspec/${{ needs.setup-rails.outputs.rails_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby
        uses: ruby/setup-ruby@v1.329.0
      # gem install puts gems in gemdir but their executables (e.g. rails) in bindir
      - name: Get gem and bin directories
        id: gems
        run: |
          echo "gemdir=$(gem env gemdir)" >> $GITHUB_OUTPUT
          echo "bindir=$(ruby -e 'puts Gem.bindir')" >> $GITHUB_OUTPUT
      - name: Restore installed gems
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gems.outputs.gemdir }}
            ${{ steps.gems.outputs.bindir }}
          key: rails-gems-${{ runner.os }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Install Postgres
        run: |
          gem install pg
      - name: Create new rails app
        run: |
          # Generate under a valid app name (a version number isn't one), then move into the versioned folder
          rails new "$RUNNER_TEMP/postgres-rspec" --database=postgresql --api --skip-test --force | tee postgres-rspec.out
          rm -rf "$APP_DIR"
          mkdir -p "$(dirname "$APP_DIR")"
          mv "$RUNNER_TEMP/postgres-rspec" "$APP_DIR"
      - name: Check for build errors
        run: |
          if grep -i "error" postgres-rspec.out; then
            echo "Error creating new rails app."
            exit 1
          fi
          if [ ! -f $APP_DIR/Gemfile ]; then
            echo "Rails app was not generated."
            exit 1
          fi
          rm postgres-rspec.out
      - name: Install RSpec
        working-directory: ${{ env.APP_DIR }}
        run: |
          bundle add rspec-rails --group "development,test"
          bin/rails generate rspec:install
          if [ ! -f spec/rails_helper.rb ]; then
            echo "RSpec was not installed."
            exit 1
          fi
      - name: Remove nested git repo so we can commit
        run: |
          rm -rf $APP_DIR/.git
      - name: Remove encrypted credentials to prevent a new PR
        run: |
          rm $APP_DIR/config/credentials.yml.enc
      - name: Verify removed files are gone
        run: |
          failed=0
          if [ -e $APP_DIR/.git ]; then
            echo "Verification failed: $APP_DIR/.git still exists."
            failed=1
          fi
          if [ -e $APP_DIR/config/credentials.yml.enc ]; then
            echo "Verification failed: $APP_DIR/config/credentials.yml.enc still exists."
            failed=1
          fi
          exit $failed
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: postgres-rspec-${{ needs.setup-rails.outputs.rails_version }}
          path: ${{ env.APP_DIR }}
          include-hidden-files: true
          if-no-files-found: error

  create-pr:
    needs: [setup-rails, create-app]
    # Only validate app generation on PRs; don't open a PR from a PR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      pr_branch: ${{ steps.cpr.outputs.pull-request-branch }}
      pr_operation: ${{ steps.cpr.outputs.pull-request-operation }}
    env:
      RAILS_VERSION: ${{ needs.setup-rails.outputs.rails_version }}
      APP_DIR: rails-api/postgres-rspec/${{ needs.setup-rails.outputs.rails_version }}
    steps:
      # Generate the short-lived installation token
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Remove existing app for this Rails version
        run: |
          rm -rf "$APP_DIR"
      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: postgres-rspec-${{ needs.setup-rails.outputs.rails_version }}
          path: ${{ env.APP_DIR }}
      # Artifact upload/download drops file modes, so restore the executable bit
      - name: Restore executable bit on bin scripts
        run: |
          chmod +x "$APP_DIR"/bin/*
      - name: Get current date (for use in PR)
        id: date
        run: |
          echo "builddate=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }} # Needs read/write for PRs and repo content
          branch: ${{ steps.date.outputs.builddate }}-postgres-rspec-${{ env.RAILS_VERSION }}-changes
          title: ${{ steps.date.outputs.builddate }} postgres-rspec changes (Rails ${{ env.RAILS_VERSION }})

  add-schema:
    needs: [setup-rails, create-pr]
    # Only when create-pr created or updated a PR branch
    if: needs.create-pr.outputs.pr_operation == 'created' || needs.create-pr.outputs.pr_operation == 'updated'
    uses: ./.github/workflows/add_schema.yml
    permissions:
      contents: write
    with:
      directory: rails-api/postgres-rspec/${{ needs.setup-rails.outputs.rails_version }}
      ref: ${{ needs.create-pr.outputs.pr_branch }}
