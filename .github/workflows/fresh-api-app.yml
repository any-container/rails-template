name: "Fresh API Rails App (w/ Postgresql & RSpec)"
# Runs from check-rails-version when a new Rails release is found, or manually.
# Builds the app for the given Rails version into rails-api/postgres-rspec/<major.minor>-latest,
# replacing the previous patch release of that minor series.
on:
  workflow_dispatch:
    inputs:
      rails_version:
        description: "Rails version to generate (e.g. 8.1.4)"
        required: true
        type: string
  workflow_call:
    inputs:
      rails_version:
        description: "Rails version to generate (e.g. 8.1.4)"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  # Stop early (skipping every job below) if a PR for this version is already open
  check-open-pr:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      pr_open: ${{ steps.pr.outputs.open }}
    steps:
      - name: Check for an open PR for this Rails minor series
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAILS_VERSION: ${{ inputs.rails_version }}
        run: |
          MINOR=$(echo "$RAILS_VERSION" | cut -d. -f1,2)
          BRANCH="postgres-rspec-${MINOR}-latest-changes"
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          if [ "$count" -gt 0 ]; then
            echo "A PR is already open for Rails $MINOR ($BRANCH). Stopping."
            echo "open=true" >> $GITHUB_OUTPUT
          else
            echo "open=false" >> $GITHUB_OUTPUT
          fi

  setup-rails:
    needs: check-open-pr
    if: needs.check-open-pr.outputs.pr_open != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      rails_version: ${{ steps.rails.outputs.version }}
      minor: ${{ steps.rails.outputs.minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Each Rails minor series gets one folder: rails-api/postgres-rspec/<major.minor>-latest
      - name: Validate Rails version
        id: rails
        env:
          RAILS_VERSION: ${{ inputs.rails_version }}
        run: |
          if ! [[ "$RAILS_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid Rails version: $RAILS_VERSION"
            exit 1
          fi
          echo "version=$RAILS_VERSION" >> $GITHUB_OUTPUT
          echo "minor=$(echo "$RAILS_VERSION" | cut -d. -f1,2)" >> $GITHUB_OUTPUT
      - name: Install Ruby
        uses: ruby/setup-ruby@v1.329.0
      - name: Install Rails
        env:
          RAILS_VERSION: ${{ steps.rails.outputs.version }}
        run: |
          gem install rails -v "$RAILS_VERSION"
      # gem install puts gems in gemdir but their executables (e.g. rails) in bindir
      - name: Get gem and bin directories
        id: gems
        run: |
          echo "gemdir=$(gem env gemdir)" >> $GITHUB_OUTPUT
          echo "bindir=$(ruby -e 'puts Gem.bindir')" >> $GITHUB_OUTPUT
      - name: Cache installed gems
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.gems.outputs.gemdir }}
            ${{ steps.gems.outputs.bindir }}
          key: rails-gems-${{ runner.os }}-${{ github.run_id }}

  create-app:
    needs: setup-rails
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      APP_DIR: rails-api/postgres-rspec/${{ needs.setup-rails.outputs.minor }}-latest
      RAILSRC: rails-api/postgres-rspec/.railsrc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby
        uses: ruby/setup-ruby@v1.329.0
      # gem install puts gems in gemdir but their executables (e.g. rails) in bindir
      - name: Get gem and bin directories
        id: gems
        run: |
          echo "gemdir=$(gem env gemdir)" >> $GITHUB_OUTPUT
          echo "bindir=$(ruby -e 'puts Gem.bindir')" >> $GITHUB_OUTPUT
      - name: Restore installed gems
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gems.outputs.gemdir }}
            ${{ steps.gems.outputs.bindir }}
          key: rails-gems-${{ runner.os }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Install Postgres
        run: |
          gem install pg
      - name: Create new rails app
        run: |
          # The app name and options come from .railsrc. Generate under that valid app name
          # (a version number isn't one), then move into the versioned folder
          APP_NAME=$(grep -v '^\s*#' "$RAILSRC" | awk 'NF && $1 !~ /^-/ {print $1; exit}')
          (cd "$RUNNER_TEMP" && rails new --rc="$GITHUB_WORKSPACE/$RAILSRC") | tee postgres-rspec.out
          rm -rf "$APP_DIR"
          mkdir -p "$(dirname "$APP_DIR")"
          mv "$RUNNER_TEMP/$APP_NAME" "$APP_DIR"
      - name: Check for build errors
        run: |
          if grep -i "error" postgres-rspec.out; then
            echo "Error creating new rails app."
            exit 1
          fi
          if [ ! -f $APP_DIR/Gemfile ]; then
            echo "Rails app was not generated."
            exit 1
          fi
          rm postgres-rspec.out
      - name: Install RSpec
        working-directory: ${{ env.APP_DIR }}
        run: |
          bundle add rspec-rails --group "development,test"
          bin/rails generate rspec:install
          if [ ! -f spec/rails_helper.rb ]; then
            echo "RSpec was not installed."
            exit 1
          fi
      - name: Remove nested git repo so we can commit
        run: |
          rm -rf $APP_DIR/.git
      - name: Remove encrypted credentials to prevent a new PR
        run: |
          rm $APP_DIR/config/credentials.yml.enc
      - name: Verify removed files are gone
        run: |
          failed=0
          if [ -e $APP_DIR/.git ]; then
            echo "Verification failed: $APP_DIR/.git still exists."
            failed=1
          fi
          if [ -e $APP_DIR/config/credentials.yml.enc ]; then
            echo "Verification failed: $APP_DIR/config/credentials.yml.enc still exists."
            failed=1
          fi
          exit $failed
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: postgres-rspec-${{ needs.setup-rails.outputs.minor }}-latest
          path: ${{ env.APP_DIR }}
          include-hidden-files: true
          if-no-files-found: error

  create-pr:
    needs: [setup-rails, create-app]
    runs-on: ubuntu-24.04
    outputs:
      pr_branch: ${{ steps.cpr.outputs.pull-request-branch }}
      pr_operation: ${{ steps.cpr.outputs.pull-request-operation }}
    env:
      RAILS_VERSION: ${{ needs.setup-rails.outputs.rails_version }}
      APP_DIR: rails-api/postgres-rspec/${{ needs.setup-rails.outputs.minor }}-latest
    steps:
      # Generate the short-lived installation token
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@v7
      # schema.rb is committed separately by add-or-update-schema, so keep it across the rebuild
      - name: Remove existing app for this Rails minor series (keeping schema.rb)
        run: |
          if [ -f "$APP_DIR/db/schema.rb" ]; then
            cp "$APP_DIR/db/schema.rb" "$RUNNER_TEMP/schema.rb"
          fi
          rm -rf "$APP_DIR"
      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: postgres-rspec-${{ needs.setup-rails.outputs.minor }}-latest
          path: ${{ env.APP_DIR }}
      - name: Restore preserved schema.rb
        run: |
          if [ -f "$RUNNER_TEMP/schema.rb" ]; then
            mkdir -p "$APP_DIR/db"
            cp "$RUNNER_TEMP/schema.rb" "$APP_DIR/db/schema.rb"
          fi
      # Artifact upload/download drops file modes, so restore the executable bit
      - name: Restore executable bit on bin scripts
        run: |
          chmod +x "$APP_DIR"/bin/*
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }} # Needs read/write for PRs and repo content
          branch: postgres-rspec-${{ needs.setup-rails.outputs.minor }}-latest-changes
          title: postgres-rspec changes (Rails ${{ env.RAILS_VERSION }})

  add-or-update-schema:
    needs: [setup-rails, create-pr]
    # Only when create-pr created or updated a PR branch
    if: needs.create-pr.outputs.pr_operation == 'created' || needs.create-pr.outputs.pr_operation == 'updated'
    uses: ./.github/workflows/add_or_update_schema.yml
    permissions:
      contents: write
    with:
      directory: rails-api/postgres-rspec/${{ needs.setup-rails.outputs.minor }}-latest
      ref: ${{ needs.create-pr.outputs.pr_branch }}
