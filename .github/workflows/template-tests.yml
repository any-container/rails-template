name: "Template tests"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  changes:
    name: Detect template changes
    runs-on: ubuntu-24.04
    outputs:
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            templates:
              - "rails-api/**"
              - ".github/workflows/template-tests.yml"
  test:
    needs: changes
    if: needs.changes.outputs.templates == 'true' || github.event_name == 'workflow_dispatch'
    name: ${{ matrix.template }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template:
          - rails-api/postgres-rspec/8.1-latest
          - rails-api/or-rspec/8.1-latest
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ${{ matrix.template }}
          bundler-cache: true
      - name: Set up database
        run: |
          bin/rails db:create
          # Templates without Active Record models (or-rspec) have no db/schema.rb.
          if [[ -f db/schema.rb ]]; then bin/rails db:schema:load; fi
      - name: Run tests
        run: bundle exec rspec
  result:
    # Stable check name for the branch ruleset. Passes when tests pass or were skipped
    # because no template changed; fails when any test job fails or is cancelled.
    name: Template tests result
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          echo "changes: ${{ needs.changes.result }}, test: ${{ needs.test.result }}"
          [[ "${{ needs.changes.result }}" == "success" ]] &&
          [[ "${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped" ]]
