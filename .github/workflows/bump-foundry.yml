name: Bump foundry submodule

# After every push to main, move the rails-template pointer in
# any-container/foundry to the new tip of main and commit it there.
# Authenticates as the anycontain-auth-app GitHub App (APP_ID variable and
# APP_PRIVATE_KEY secret). The app must be installed
# on any-container/foundry with contents: write.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bump-foundry
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: any-container
          repositories: foundry

      - name: Check out foundry
        uses: actions/checkout@v7
        with:
          repository: any-container/foundry
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Update rails-template submodule to its main
        run: git submodule update --init --remote implementations/rails-template

      - name: Commit and push the new pointer
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- implementations/rails-template; then
            echo "Pointer already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementations/rails-template
          git commit -m "Bump rails-template to ${SOURCE_SHA:0:7}"
          git push origin HEAD:main
