name: "Create infra via TF for postgres-app"
on:
  workflow_dispatch:
permissions: write-all
jobs:
  fresh-terraform-for-postgres-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        # Use aws-actions/configure-aws-credentials for robust credential handling
        # It's recommended to use OIDC where possible for enhanced security
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: |
          terraform -chdir=infra/postgres-app fmt -check
      - name: Terraform Init
        run: |
          terraform -chdir=infra/postgres-app init -input=false
      - name: Terraform Validate
        run: |
          terraform -chdir=infra/postgres-app validate -no-color
      - name: Terraform Apply
        id: apply
        run: |
          terraform -chdir=infra/postgres-app apply -no-color -input=false
