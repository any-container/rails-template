name: "Create infra via TF for postgres-app"
on:
  workflow_dispatch:
permissions: write-all
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
jobs:
  fresh-terraform-for-postgres-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: |
          terraform -chdir=infra/postgres-app fmt -check
      - name: Terraform Init
        run: |
          terraform -chdir=infra/postgres-app init -input=false
      - name: Terraform Validate
        run: |
          terraform -chdir=infra/postgres-app validate -no-color
      - name: Terraform Apply
        id: apply
        run: |
          terraform -chdir=infra/postgres-app apply -no-color -input=false
