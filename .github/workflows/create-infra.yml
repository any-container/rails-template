name: "Create infra via TF for postgres-app"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fresh-terraform-for-postgres-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: |
          terraform fmt -check
        continue-on-error: true
      - name: Terraform Init
        run: |
          terraform init -input=false -chdir=infra/postgres-app
      - name: Terraform Validate
        run: |
          terraform validate -no-color
      - name: Terraform Apply
        id: apply
        run: terraform apply -no-color -input=false
