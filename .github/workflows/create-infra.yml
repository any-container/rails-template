# AWS OIDC authorization built by hand elsewhere using these guides
# https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws
# https://github.com/aws-actions/configure-aws-credentials?tab=readme-ov-file#oidc-configuration
name: "Create infra via TF for postgres-app"
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  fresh-terraform-for-postgres-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::530245975994:role/oidc-rails-template
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: |
          terraform -chdir=infra/postgres-app fmt -check
      - name: Terraform Init
        run: |
          terraform -chdir=infra/postgres-app init -input=false
      - name: Terraform Validate
        run: |
          terraform -chdir=infra/postgres-app validate -no-color
      - name: Terraform Apply
        id: apply
        run: |
          terraform -chdir=infra/postgres-app apply -no-color -auto-approve
