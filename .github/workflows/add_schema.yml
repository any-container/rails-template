name: "Add Schema"
on:
  workflow_call:
    inputs:
      directory:
        description: "Rails app directory to run against (relative to repo root)"
        required: true
        type: string
      ref:
        description: "Branch to check out and commit schema.rb to"
        required: true
        type: string
permissions:
  contents: write
jobs:
  add-schema:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:11-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_development
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: development
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_development"
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Check whether schema.rb exists
        id: existing
        run: |
          if [ -e db/schema.rb ]; then
            echo "db/schema.rb already exists in ${{ inputs.directory }}; skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          fi
      - name: Install Ruby and gems
        if: steps.existing.outputs.exists != 'true'
        uses: ruby/setup-ruby@v1.329.0
        with:
          bundler-cache: true
          working-directory: ${{ inputs.directory }}
      - name: Create and migrate database
        if: steps.existing.outputs.exists != 'true'
        run: bundle exec rails db:create db:migrate
      - name: Verify schema.rb was created
        if: steps.existing.outputs.exists != 'true'
        run: |
          if [ ! -f db/schema.rb ]; then
            echo "db/schema.rb was not created."
            exit 1
          fi
      - name: Commit schema.rb
        if: steps.existing.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.rb
          git commit -m "Add schema.rb"
          git push origin "HEAD:${{ inputs.ref }}"
