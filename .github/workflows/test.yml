name: "Workflow for tests"
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: |
          echo "builddate=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: print date
        run: |
          echo $DEBUG
        env:
          DEBUG: ${{ steps.date.outputs.builddate }}-DEBUG
          RELEASE: ${{  steps.date.outputs.builddate }}-RELEASE
