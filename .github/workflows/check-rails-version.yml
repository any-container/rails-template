name: "Check for new Rails release"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  check-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.compare.outputs.versions }}
      has_updates: ${{ steps.compare.outputs.has_updates }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # For each minor series that has a <major.minor>-latest folder, plus the newest stable
      # minor on rubygems, find the newest stable patch and compare it with the built Rails version
      - name: Compare latest Rails patch of each minor series with the built apps
        id: compare
        env:
          APP_ROOT: rails-api/postgres-rspec
        run: |
          all=$(curl -fsS https://rubygems.org/api/v1/versions/rails.json | jq -r '.[] | select(.prerelease | not) | .number')
          if [ -z "$all" ]; then
            echo "Could not determine the Rails versions."
            exit 1
          fi
          newest_minor=$(echo "$all" | sort -V | tail -1 | cut -d. -f1,2)
          minors=$( (ls "$APP_ROOT" | sed -n 's/^\([0-9]*\.[0-9]*\)-latest$/\1/p'; echo "$newest_minor") | sort -uV)
          updates=()
          for minor in $minors; do
            latest=$(echo "$all" | grep -E "^${minor//./\.}\.[0-9]+$" | sort -V | tail -1)
            lock="$APP_ROOT/$minor-latest/Gemfile.lock"
            current=""
            if [ -f "$lock" ]; then
              current=$(sed -n 's/^    rails (\(.*\))$/\1/p' "$lock" | head -1)
            fi
            echo "$minor: built ${current:-none}, latest $latest"
            if [ "$current" != "$latest" ]; then
              updates+=("$latest")
            fi
          done
          echo "versions=$(printf '%s\n' "${updates[@]}" | jq -R . | jq -sc 'map(select(. != ""))')" >> $GITHUB_OUTPUT
          echo "has_updates=$([ ${#updates[@]} -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

  fresh-api-app:
    needs: check-version
    if: needs.check-version.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix:
        rails_version: ${{ fromJSON(needs.check-version.outputs.versions) }}
    uses: ./.github/workflows/fresh-api-app.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      rails_version: ${{ matrix.rails_version }}
