name: "Check for new Rails release"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  check-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      updates: ${{ steps.compare.outputs.updates }}
      has_updates: ${{ steps.compare.outputs.has_updates }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # For each variant (folder in rails-api/) and each minor series that has a <major.minor>-latest folder,
      # plus the newest stable minor on rubygems, find the newest stable patch and compare it with the
      # built Rails version
      - name: Compare latest Rails patch of each minor series with the built apps
        id: compare
        run: |
          all=$(curl -fsS https://rubygems.org/api/v1/versions/rails.json | jq -r '.[] | select(.prerelease | not) | .number')
          if [ -z "$all" ]; then
            echo "Could not determine the Rails versions."
            exit 1
          fi
          newest_minor=$(echo "$all" | sort -V | tail -1 | cut -d. -f1,2)
          updates=()
          for variant_dir in rails-api/*/; do
            variant=$(basename "$variant_dir")
            minors=$( (ls "$variant_dir" | sed -n 's/^\([0-9]*\.[0-9]*\)-latest$/\1/p'; echo "$newest_minor") | sort -uV)
            for minor in $minors; do
              latest=$(echo "$all" | grep -E "^${minor//./\.}\.[0-9]+$" | sort -V | tail -1)
              lock="$variant_dir$minor-latest/Gemfile.lock"
              current=""
              if [ -f "$lock" ]; then
                current=$(sed -n 's/^    rails (\(.*\))$/\1/p' "$lock" | head -1)
              fi
              echo "$variant $minor: built ${current:-none}, latest $latest"
              if [ "$current" != "$latest" ]; then
                updates+=("$variant $latest")
              fi
            done
          done
          echo "updates=$(printf '%s\n' "${updates[@]}" | jq -R 'select(. != "") | split(" ") | {variant: .[0], rails_version: .[1]}' | jq -sc .)" >> $GITHUB_OUTPUT
          echo "has_updates=$([ ${#updates[@]} -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

  fresh-api-app:
    needs: check-version
    if: needs.check-version.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJSON(needs.check-version.outputs.updates) }}
    uses: ./.github/workflows/fresh-api-app.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      rails_version: ${{ matrix.update.rails_version }}
      variant: ${{ matrix.update.variant }}
