name: "Check for new Rails release"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  check-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      new_release: ${{ steps.compare.outputs.new_release }}
      latest: ${{ steps.compare.outputs.latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # latest.json only returns the newest stable release (no prereleases)
      - name: Compare latest Rails release with the version folders
        id: compare
        env:
          APP_ROOT: rails-api/postgres-rspec
        run: |
          latest=$(curl -fsS https://rubygems.org/api/v1/versions/rails/latest.json | jq -r .version)
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "Could not determine the latest Rails version."
            exit 1
          fi
          echo "latest=$latest" >> $GITHUB_OUTPUT
          current=$(ls "$APP_ROOT" | grep -E '^[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          echo "Built: ${current:-none}, latest: $latest"
          if [ "$current" = "$latest" ] || [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$latest" ]; then
            echo "new_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "new_release=true" >> $GITHUB_OUTPUT

  fresh-api-app:
    needs: check-version
    if: needs.check-version.outputs.new_release == 'true'
    uses: ./.github/workflows/fresh-api-app.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      rails_version: ${{ needs.check-version.outputs.latest }}
