name: "New Rails App (w/ Postgres)"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  # Reference gist for rails new https://gist.github.com/eliotsykes/ace0222174804372b51a
  # TODO make a vanilla version of this that does plain `rails new`
  # TODO have them share GA code
  setup-rails:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby
        uses: ruby/setup-ruby@v1.329.0
      - name: Install Rails
        run: |
          gem install rails
      # gem install puts gems in gemdir but their executables (e.g. rails) in bindir
      - name: Get gem and bin directories
        id: gems
        run: |
          echo "gemdir=$(gem env gemdir)" >> $GITHUB_OUTPUT
          echo "bindir=$(ruby -e 'puts Gem.bindir')" >> $GITHUB_OUTPUT
      - name: Cache installed gems
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.gems.outputs.gemdir }}
            ${{ steps.gems.outputs.bindir }}
          key: rails-gems-${{ runner.os }}-${{ github.run_id }}

  create-app:
    needs: setup-rails
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby
        uses: ruby/setup-ruby@v1.329.0
      # gem install puts gems in gemdir but their executables (e.g. rails) in bindir
      - name: Get gem and bin directories
        id: gems
        run: |
          echo "gemdir=$(gem env gemdir)" >> $GITHUB_OUTPUT
          echo "bindir=$(ruby -e 'puts Gem.bindir')" >> $GITHUB_OUTPUT
      - name: Restore installed gems
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gems.outputs.gemdir }}
            ${{ steps.gems.outputs.bindir }}
          key: rails-gems-${{ runner.os }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Install Postgres
        run: |
          gem install pg
      - name: Create new rails app
        run: |
          rails new postgres-app --database=postgresql --force | tee postgres-app.out
        # TODO switch to rspec and add --skip-test-unit here
      - name: Check for build errors
        run: |
          if grep -i "error" postgres-app.out; then
            echo "Error creating new rails app."
            exit 1
          fi
          if [ ! -f postgres-app/Gemfile ]; then
            echo "Rails app was not generated."
            exit 1
          fi
          rm postgres-app.out
      - name: Remove nested git repo so we can commit
        run: |
          rm -rf postgres-app/.git
      - name: Remove encrypted credentials to prevent a new PR
        run: |
          rm postgres-app/config/credentials.yml.enc
      - name: Verify removed files are gone
        run: |
          failed=0
          if [ -e postgres-app/.git ]; then
            echo "Verification failed: postgres-app/.git still exists."
            failed=1
          fi
          if [ -e postgres-app/config/credentials.yml.enc ]; then
            echo "Verification failed: postgres-app/config/credentials.yml.enc still exists."
            failed=1
          fi
          exit $failed
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: postgres-app
          path: postgres-app
          include-hidden-files: true
          if-no-files-found: error

  create-pr:
    needs: create-app
    runs-on: ubuntu-24.04
    steps:
      # Generate the short-lived installation token
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Remove existing app
        run: |
          rm -rf postgres-app/*
      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: postgres-app
          path: postgres-app
      - name: Get current date (for use in PR)
        id: date
        run: |
          echo "builddate=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }} # Needs read/write for PRs and repo content
          branch: ${{ steps.date.outputs.builddate }}-postgres-app-changes
          title: ${{ steps.date.outputs.builddate }} postgres-app changes
