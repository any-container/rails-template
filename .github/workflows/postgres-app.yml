name: "New Rails App (w/ Postgres)"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  # TODO split this up for faster retries?
  build-postgres-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@78c01b705fd9d5ad960d432d3a0cfa341d50e410 # v1.179.1
        with:
          bundler-cache: true
      - name: Install Rails
        run: gem install rails
      - name: Install Postgres
        run: gem install pg
      - name: Create new rails app
        run: rails new postgres-app --postgres | tee postgres-app.out
        # TODO add force flag to include new changes
      - name: Check for build errors
        run: |
          if grep -i "error" postgres-app.out; then
            echo "Error creating new rails app."
            exit 1
          fi
          rm postgres-app.out
      - name: Remove nested git repo
        run: |
          rm -rf postgres-app/.git
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          # TODO have a dynamic branch name based on the date
          # TODO have dynamic PR description content that contains a summary of the changes
