name: "New Rails App (w/ Postgres)"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  # TODO make a vanilla version of this that does plain `rails new`
  # TODO have them share GA code
  build-postgres-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1.276.0
        with:
          bundler-cache: true
      - name: Install Rails
        run: |
          gem install rails
      - name: Install Postgres
        run: |
          gem install pg
      - name: Create new rails app
        run: |
          rails new tmp --database=postgresql --force | tee postgres-app.out
        # TODO switch to rspec and add --skip-test-unit here
      - name: Check for build errors
        run: |
          if grep -i "error" postgres-app.out; then
            echo "Error creating new rails app."
            exit 1
          fi
          rm postgres-app.out
      - name: Clear existing postgres-app, then move newly built one in place
        run: |
          rm -rf postgres-app/*
          rm -rf tmp/.git
          mv -f tmp/* postgres-app/*
      - name: Get current date (for use in PR)
        id: date
        run: |
          echo "builddate=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }} # Needs read/write for PRs and repo content
          branch: ${{ steps.date.outputs.builddate }}-postgres-app-changes
          title: ${{ steps.date.outputs.builddate }} postgres-app changes
          # TODO have dynamic PR description content that contains a summary of the changes
