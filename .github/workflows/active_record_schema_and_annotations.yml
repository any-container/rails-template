name: "Active Record Schema and Annotations"
# Migrates the database to produce db/schema.rb, then annotates models with annotaterb (the maintained
# fork of the annotate gem). Only for variants that use Active Record.
on:
  workflow_call:
    inputs:
      directory:
        description: "Rails app directory to run against (relative to repo root)"
        required: true
        type: string
      ref:
        description: "Branch to check out and commit schema.rb and model annotations to"
        required: true
        type: string
permissions:
  contents: write
jobs:
  active-record-schema-and-annotations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:11-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_development
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: development
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_development"
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1.329.0
        with:
          bundler-cache: true
          working-directory: ${{ inputs.directory }}
      - name: Create and migrate database
        run: bundle exec rails db:create db:migrate
      - name: Verify schema.rb was created
        run: |
          if [ ! -f db/schema.rb ]; then
            echo "db/schema.rb was not created."
            exit 1
          fi
      - name: Annotate models
        run: bundle exec annotaterb models
      - name: Commit schema.rb and annotations if changed
        run: |
          if [ -z "$(git status --porcelain -- .)" ]; then
            echo "Schema and annotations are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .
          git commit -m "Add or update schema.rb and model annotations"
          git push origin "HEAD:${{ inputs.ref }}"
