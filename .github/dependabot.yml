version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    # First matching group wins, so keep dev-and-test first.
    dev-and-test:
      dependency-type: development
      update-types:
      - minor
      - patch
    rails:
      patterns:
      - "rails"
      - "rails-*"
      - "action*"
      - "active*"
    solid:
      patterns:
      - "solid_*"
    rom:
      patterns:
      - "rom"
      - "rom-*"
    production-minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions:
      patterns:
      - "*"
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
